<svg xmlns="http://www.w3.org/2000/svg" width="996" height="648" viewBox="72 30 498 324" fill="none" role="img" aria-labelledby="title desc">
      <title id="title">ClearCast — screen mirroring, minimal blue illustration</title>
      <desc id="desc">A laptop displays the same portrait interface as a phone beside it. A standard Wi-Fi icon uses three concentric circular arcs. Transparent background.</desc>
      <defs>
  <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#38536C"/><stop offset="1" stop-color="#1F354B"/>
  </linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#E3ECF4"/><stop offset="1" stop-color="#AFBFCE"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#1298EB"/><stop offset="1" stop-color="#0078D4"/>
  </linearGradient>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#F5FAFE"/><stop offset="1" stop-color="#E4F0FB"/>
  </linearGradient>
</defs>
